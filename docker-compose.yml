# One command to run everything:
#
#   docker compose up --build
#
# App:       http://localhost:8080
# API:       http://localhost:8000      (direct access, handy for agent scripts)
# API docs:  http://localhost:8080/docs
#
# Change ports with WEB_PORT / API_PORT, e.g. `WEB_PORT=3000 docker compose up`.

name: shopdesk

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/shopdesk.db
      AUTO_SEED: "true"
      DEFAULT_SEED: "42"
      ADMIN_ENABLED: "true"
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://localhost:5173
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - shopdesk-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The SQLite database lives here, so data survives restarts and rebuilds.
  # `docker compose down -v` deletes it (it's re-seeded on the next start).
  shopdesk-data:
