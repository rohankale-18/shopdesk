[project]
name = "shopdesk-api"
version = "0.1.0"
description = "ShopDesk: an e-commerce support backend built as a playground for AI agents"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.44.0",
    "fastapi[standard]>=0.162.0",
    "groq>=1.7.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
shopdesk = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
